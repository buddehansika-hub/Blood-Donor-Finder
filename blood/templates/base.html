{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Blood Donor Finder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">

<div class="container">

<a class="navbar-brand" href="/">🩸 Blood Donor Finder</a>

<div>

{% if user.is_authenticated %}

<a class="btn btn-light me-2" href="{% url 'dashboard' %}">Dashboard</a>

<a class="btn btn-warning" href="{% url 'logout' %}">Logout</a>

{% else %}

<a class="btn btn-light me-2" href="{% url 'login' %}">Login</a>

<a class="btn btn-warning" href="{% url 'register' %}">Register</a>

{% endif %}

</div>

</div>

</nav>

<div class="container mt-4">

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

{% block content %}
{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
